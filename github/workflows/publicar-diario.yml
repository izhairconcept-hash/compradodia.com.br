name: Publicar Conteudo e Distribuir

on:
  schedule:
    # Fase 1 (Aquecimento - 2x/dia): 12:00 UTC (09h BRT) e 21:00 UTC (18h BRT)
    - cron: '0 12,21 * * *'
    # Fase 2 (Escala - 4x/dia): troque a linha acima por:
    # - cron: '0 11,14,18,22 * * *'
  workflow_dispatch: # Permite rodar manualmente para testar agora mesmo

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar Artigo, Atualizar Site e Disparar Redes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          WHATSAPP_GRUPO_VIP_ID: ${{ secrets.WHATSAPP_GRUPO_VIP_ID }}
          SEU_WHATSAPP: ${{ secrets.SEU_WHATSAPP }}
          LINK_CONVITE_GRUPO_VIP: ${{ secrets.LINK_CONVITE_GRUPO_VIP }}
        run: node scripts/publicar-conteudo.js

      - name: Commit e Push para GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publica novo artigo e atualiza sitemap" && git push)
